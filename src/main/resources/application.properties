# ===================================================================
# ConcurrentKVStore - Server & Storage Configuration
# ===================================================================

# Network Server Settings
server.host=127.0.0.1
server.port=6379
server.max-connections=50
server.worker-threads=16

# Database & In-Memory Cache Settings
database.max-keys=1000

# Snapshot Persistence Settings
storage.data-dir=./data
storage.snapshot-filename=snapshot.ckv
storage.snapshot-interval-seconds=60

# Background TTL Expiration Cleanup Settings
ttl.cleanup-interval-ms=200

# Protocol & Security Limits
protocol.max-line-length=65536
